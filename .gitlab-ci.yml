stages:
  - build
  - assemble
  - scan
  - publish
  - deploy
  - validate

variables:
  DOCKER_IMAGE: "dulno-team"
  DOCKER_DOCS_IMAGE: "dulno-team-docs"
  KUBERNETES_RESOURCE: "deployment/dulno-team-deployment"
  KUBERNETES_APP:  "dulno-team"

build:
  stage: build
  image: gradle:8.12-jdk21
  script:
    - gradle bootJar
    - gradle javadoc
    - gradle downloadGeoLite2Database
  artifacts:
    paths:
      - build/libs/
      - build/docs/javadoc/
      - geo/
    expire_in: 1 day

assemble:
  stage: assemble
  image: docker:cli
  services:
    - docker:dind
  dependencies:
    - build
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin $DOCKER_REGISTRY
    - docker build -t $DOCKER_REGISTRY/$DOCKER_IMAGE:test .
    - docker push $DOCKER_REGISTRY/$DOCKER_IMAGE:test
  only:
    - master

scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  dependencies:
    - assemble
  variables:
    GIT_STRATEGY: none
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    TRIVY_USERNAME: $DOCKER_USERNAME
    TRIVY_PASSWORD: $DOCKER_PASSWORD
  script:
    - trivy --version
    - time trivy clean --scan-cache
    - time trivy image --download-db-only --no-progress --cache-dir .trivycache/
    - trivy image --ignore-unfixed --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --cache-dir .trivycache/ $DOCKER_REGISTRY/$DOCKER_IMAGE:test
  cache:
    paths:
      - .trivycache/
  only:
    - master

publish:
  stage: publish
  image: docker:cli
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  dependencies:
    - build
  script:
    - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin $DOCKER_REGISTRY
    - docker pull $DOCKER_REGISTRY/$DOCKER_IMAGE:test
    - docker tag $DOCKER_REGISTRY/$DOCKER_IMAGE:test $DOCKER_REGISTRY/$DOCKER_IMAGE:latest
    - docker push $DOCKER_REGISTRY/$DOCKER_IMAGE:latest
    - docker buildx build -t $DOCKER_REGISTRY/$DOCKER_DOCS_IMAGE:latest -f docs/Dockerfile .
    - docker push $DOCKER_REGISTRY/$DOCKER_DOCS_IMAGE:latest
  only:
    - master

deploy_team:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  dependencies:
    - publish
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBERNETES_CONFIGURATION" > ~/.kube/config
  script:
    - kubectl rollout restart $KUBERNETES_RESOURCE
    - kubectl rollout status $KUBERNETES_RESOURCE
  only:
    - master

deploy_wiki:
  stage: deploy
  trigger:
    project: $WIKI_PIPELINE_PROJECT
    branch: $WIKI_PIPELINE_BRANCH
  only:
    - master

validate:
  stage: validate
  image:
    name: bitnami/kubectl:latest
    entrypoint: [ "" ]
  dependencies:
    - deploy_team
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBERNETES_CONFIGURATION" > ~/.kube/config
  script:
    - |
      NEW_POD=$(kubectl get pods -l app=${KUBERNETES_APP} -o jsonpath='{.items[0].metadata.name}')
      kubectl logs $NEW_POD
  only:
    - master
  when: manual
